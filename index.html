<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Onward</title>
<style>
  :root {
    /* Dark, Echo-inspired palette with a cyan accent */
    --bg:            #060a17;
    --bg-2:          #0b1124;
    --bg-3:          #111933;
    --bg-4:          #18224a;
    --surface:       #0e1530;
    --surface-2:     #131c3b;

    --text:          #eaf0ff;
    --text-dim:      #a9b4d6;
    --text-mute:     #7886ad;

    --accent:        #19cdfc;
    --accent-dim:    #0fa9d3;
    --accent-glow:   rgba(25, 205, 252, 0.30);
    --accent-soft:   rgba(25, 205, 252, 0.13);
    --accent-softer: rgba(25, 205, 252, 0.07);

    --ok:            #2ee59d;
    --ok-soft:       rgba(46, 229, 157, 0.14);
    --warn:          #ffb547;
    --warn-soft:     rgba(255, 181, 71, 0.16);

    --border:        #1f2b52;
    --border-2:      #18224a;

    --user-bg:       #19cdfc;
    --user-text:     #04101f;

    --reminder-bg:   #1a2244;
    --reminder-bord: #2c386e;
    --reminder-text: #eaf0ff;

    --radius-sm:     8px;
    --radius-md:     14px;
    --radius-lg:     20px;
    --radius-pill:   999px;

    --shadow-sm:     0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-md:     0 2px 10px rgba(0, 0, 0, 0.40);
    --shadow-lg:     0 8px 28px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-pill);
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }
  * { scrollbar-color: rgba(255, 255, 255, 0.12) transparent; scrollbar-width: thin; }

  #app { display: flex; height: 100vh; }

  /* ---------------------------------------------------------------------
     Chat column
     --------------------------------------------------------------------- */

  #chat {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    background: var(--bg);
  }

  #chat header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-2);
  }
  #chat header .title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  #chat header .subtitle {
    font-size: 12px;
    color: var(--text-mute);
    margin-top: 2px;
  }
  #chat header .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  #chat header .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px rgba(34, 181, 115, 0.4);
  }

  /* Reminder banner */
  #flag-banner {
    display: none;
    margin: 16px 28px 0;
    padding: 14px 18px 14px 22px;
    background: var(--reminder-bg);
    border: 1px solid var(--warn);
    border-radius: var(--radius-md);
    color: var(--reminder-text);
    align-items: flex-start;
    gap: 14px;
    position: relative;
    box-shadow: var(--shadow-sm);
  }
  #flag-banner::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--warn);
    border-radius: var(--radius-md) 0 0 var(--radius-md);
  }
  #flag-banner.visible { display: flex; }
  #flag-banner .body { flex: 1 1 auto; padding-left: 6px; min-width: 0; }
  #flag-banner .title {
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--warn);
    margin-bottom: 6px;
  }
  #flag-banner .msg {
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    color: var(--text);
    overflow: visible;
  }
  #flag-banner .actions {
    display: flex;
    align-items: flex-start;
    margin-left: 12px;
    flex: 0 0 auto;
    align-self: flex-start;
  }
  #flag-banner button {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 6px 14px;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  #flag-banner button:hover {
    background: var(--bg-3);
    color: var(--text);
  }

  /* Message stream */
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px 28px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: msgIn 0.24s ease-out;
  }
  .row.user { justify-content: flex-end; }
  .row.sys  { justify-content: flex-start; }
  .row.error{ justify-content: flex-start; }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    margin-top: 2px;
  }
  .row.user .avatar {
    background: var(--accent);
    color: #ffffff;
  }

  .bubble {
    max-width: 640px;
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .row.sys .bubble {
    background: var(--bg-2);
    color: var(--text);
    border: 1px solid var(--border-2);
    border-top-left-radius: 6px;
  }
  .row.sys.intro .bubble {
    background: var(--accent-softer);
    border-color: var(--accent-soft);
    color: var(--text);
  }
  .row.user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-top-right-radius: 6px;
  }
  .row.error .bubble {
    background: #fdecef;
    border: 1px solid #f8cbd4;
    color: #8a1f38;
  }

  .bubble .meta {
    font-size: 11px;
    color: var(--text-mute);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  /* Thinking bubble */
  .row.thinking .bubble {
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    color: var(--text-mute);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .row.thinking .bubble::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: thinkPulse 1.4s ease-in-out infinite;
  }
  @keyframes thinkPulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.1); }
  }

  /* Composer */
  #composer {
    display: flex;
    gap: 10px;
    padding: 16px 28px 24px;
    background: var(--bg);
    align-items: flex-end;
  }
  #input {
    flex: 1 1 auto;
    background: var(--bg-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 14px 22px;
    font: inherit;
    line-height: 1.5;
    resize: none;
    min-height: 52px;
    max-height: 160px;
    outline: none;
    transition: all 0.15s ease;
  }
  #input::placeholder { color: var(--text-mute); }
  #input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #send {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 50%;
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px var(--accent-glow);
  }
  #send:hover:not(:disabled) {
    background: var(--accent-dim);
    transform: translateY(-1px);
  }
  #send:active:not(:disabled) { transform: scale(0.96); }
  #send:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

  /* ---------------------------------------------------------------------
     Right sidebar — goals
     --------------------------------------------------------------------- */

  #sidebar {
    width: 400px;
    flex: 0 0 400px;
    display: flex;
    flex-direction: column;
    background: var(--bg-2);
    border-left: 1px solid var(--border);
    overflow: hidden;
  }

  #sidebar header {
    padding: 20px 24px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-2);
  }
  #sidebar header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  #refresh {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 4px 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
  }
  #refresh:hover:not(:disabled) { color: var(--accent); }
  #refresh:disabled { opacity: 0.4; cursor: wait; }

  #goals { flex: 1 1 auto; overflow-y: auto; padding: 16px 18px 20px; }

  .goal {
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s ease;
  }
  .goal:hover {
    border-color: var(--accent-soft);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .goal .top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .goal .glyph {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
  }
  .goal .glyph.type-1 { background: rgba(232, 162, 60, 0.14); color: #c07e1a; }
  .goal .glyph.type-2 { background: rgba(34, 181, 115, 0.14); color: #1a8a56; }
  .goal .glyph.type-3 { background: rgba(91, 91, 255, 0.12); color: #4a4acc; }
  .goal .glyph.type-4 { background: rgba(232, 96, 108, 0.14); color: #c04a58; }
  .goal .glyph.type-5 { background: rgba(120, 90, 220, 0.14); color: #6846c8; }

  .goal .head {
    flex: 1 1 auto;
    min-width: 0;
  }
  .goal h2 {
    font-size: 14.5px;
    margin: 0 0 2px 0;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .goal .meta {
    font-size: 12px;
    color: var(--text-mute);
    line-height: 1.4;
  }

  .goal .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .goal .progress .bar {
    flex: 1 1 auto;
    height: 4px;
    background: var(--bg-3);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .goal .progress .bar .fill {
    height: 100%;
    background: var(--accent);
    border-radius: var(--radius-pill);
    transition: width 0.3s ease;
  }
  .goal .progress .count {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.01em;
    min-width: 70px;
    text-align: right;
    font-weight: 500;
  }

  .items { list-style: none; padding: 0; margin: 0; }
  .items li {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 6px 0;
    font-size: 13px;
    line-height: 1.5;
    border-top: 1px solid var(--border-2);
  }
  .items li:first-child { border-top: none; }
  .items li .icon {
    flex: 0 0 18px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-mute);
  }
  .items li .body { flex: 1 1 auto; min-width: 0; }
  .items li .label { color: var(--text); }

  .items li .sub {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .items li .sub .badge {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    background: var(--bg-3);
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }
  .items li .sub .badge.accent {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .items li .sub .badge.ok {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .items li .sub .badge.warn {
    background: var(--warn-soft);
    color: var(--warn);
  }

  .items li.done .label {
    color: var(--text-mute);
    text-decoration: line-through;
    text-decoration-color: rgba(15, 18, 34, 0.2);
  }
  .items li.done .icon { color: var(--ok); }

  /* ---------------------------------------------------------------------
     Time travel / demo panel
     --------------------------------------------------------------------- */

  #demo {
    padding: 14px 20px 18px;
    background: var(--bg-3);
    border-top: 1px solid var(--border-2);
  }
  #demo .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-mute);
    margin-bottom: 8px;
  }
  #demo .row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  #demo button {
    background: var(--bg-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 5px 12px;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  #demo button:hover:not(:disabled) {
    color: var(--accent);
    border-color: var(--accent-soft);
    background: var(--bg-2);
  }
  #demo button:disabled { opacity: 0.4; cursor: wait; }
  #demo button#reset-clock { margin-left: auto; }
  #demo .clock {
    font-size: 11px;
    color: var(--text-mute);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
  #demo .clock.sim { color: var(--accent); font-weight: 600; }

  /* ---------------------------------------------------------------------
     Empty & skeleton states
     --------------------------------------------------------------------- */

  .empty {
    color: var(--text-mute);
    padding: 40px 20px;
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
  }
  .empty strong {
    display: block;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .skeleton-wrap { display: flex; flex-direction: column; gap: 12px; }
  .skeleton-card {
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-lg);
    padding: 16px;
  }
  .skeleton-line {
    height: 10px;
    background: linear-gradient(
      90deg,
      var(--bg-3) 0%,
      var(--accent-softer) 50%,
      var(--bg-3) 100%
    );
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.6s ease-in-out infinite;
    border-radius: 4px;
    margin: 8px 0;
  }
  .skeleton-line.title { width: 55%; height: 12px; margin-bottom: 12px; }
  .skeleton-line.meta  { width: 35%; height: 10px; margin-bottom: 14px; }
  .skeleton-line.item  { width: 85%; }
  .skeleton-line.item.short { width: 62%; }
  @keyframes skeleton-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ---------------------------------------------------------------------
     Voice stage (replaces the chat column)
     --------------------------------------------------------------------- */
  #stage {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(25,205,252,0.10), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(106,92,255,0.10), transparent 60%),
      var(--bg);
  }
  #stage header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px 14px;
  }
  #stage header .title { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  #stage header .subtitle { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
  #stage header .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
  #stage header .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 8px rgba(46,229,157,0.5);
  }
  #stage #flag-banner { margin: 8px 28px 0; }

  #orb-wrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 32px 28px;
    min-height: 0;
  }

  /* The orb itself (plus its label and captions) is centered in whatever
     space is left after the suggestion chips and support note below it,
     instead of the old behavior where justify-content:center balanced the
     WHOLE stack (orb + chips + note) and the chips' height dragged the orb
     up above true center. */
  .orb-center {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    width: 100%;
    min-height: 0;
  }

  #chips, #support-note {
    flex: 0 0 auto;
  }

  #orb {
    position: relative;
    width: 230px;
    height: 230px;
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 50%;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  #orb:focus-visible { box-shadow: 0 0 0 3px var(--accent-glow); }
  #orb .ring, #orb .halo, #orb .core { position: absolute; border-radius: 50%; }

  #orb .ring {
    inset: 0;
    border: 7px solid rgba(25, 205, 252, 0.28);
    box-shadow: 0 0 46px rgba(25,205,252,0.16), inset 0 0 40px rgba(25,205,252,0.10);
    transition: border-color 0.35s ease, box-shadow 0.35s ease;
  }
  #orb .halo {
    inset: 0;
    border: 2px solid rgba(25, 205, 252, 0.0);
    opacity: 0;
  }
  #orb .core {
    inset: 38px;
    background: radial-gradient(circle at 50% 38%, rgba(25,205,252,0.20), rgba(25,205,252,0.03) 72%);
    transition: opacity 0.3s ease;
  }

  /* listening: bright steady ring with a soft breathing glow and ripples */
  body[data-state="listening"] #orb .ring {
    border-color: var(--accent);
    box-shadow: 0 0 70px rgba(25,205,252,0.65), inset 0 0 55px rgba(25,205,252,0.38);
    animation: breathe 1.5s ease-in-out infinite;
  }
  body[data-state="listening"] #orb .halo { animation: ripple 1.9s ease-out infinite; }
  body[data-state="listening"] #orb .halo.h2 { animation-delay: 0.95s; }

  /* thinking: a bright arc travels around the ring */
  body[data-state="thinking"] #orb .ring {
    border-color: rgba(25,205,252,0.18);
    border-top-color: var(--accent);
    border-right-color: #6a5cff;
    box-shadow: 0 0 40px rgba(25,205,252,0.25);
    animation: spin 0.95s linear infinite;
  }
  body[data-state="thinking"] #orb .core { opacity: 0.55; }

  /* speaking: the whole ring pulses like it is talking */
  body[data-state="speaking"] #orb .ring {
    border-color: var(--accent);
    box-shadow: 0 0 80px rgba(25,205,252,0.7), inset 0 0 60px rgba(25,205,252,0.45);
    animation: talk 0.62s ease-in-out infinite alternate;
  }
  body[data-state="speaking"] #orb .core { animation: talkcore 0.62s ease-in-out infinite alternate; }

  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes ripple {
    0%   { transform: scale(1);    opacity: 0.55; border-color: rgba(25,205,252,0.7); }
    100% { transform: scale(1.55); opacity: 0;    border-color: rgba(25,205,252,0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes talk { from { transform: scale(0.985); } to { transform: scale(1.06); } }
  @keyframes talkcore { from { opacity: 0.5; transform: scale(0.94); } to { opacity: 1; transform: scale(1.04); } }

  #state-label {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-mute);
    min-height: 18px;
  }
  body[data-state="listening"] #state-label { color: var(--accent); }

  /* Bounded + scrollable instead of growing freely: a long reply (e.g. a
     briefing) used to force this flex item past its allotted space, and
     because the container's justify-content:center split that overflow
     evenly above and below, the text bled down over the chips. Capping
     the height and scrolling internally keeps the rest of the layout put. */
  #captions {
    width: min(640px, 100%);
    min-height: 90px;
    max-height: 46vh;
    overflow-y: auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 2px 6px 2px 2px;
  }
  #heard { font-size: 13px; color: var(--text-mute); min-height: 20px; }
  #reply {
    font-size: 16px;
    line-height: 1.55;
    color: var(--text);
    font-weight: 500;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: pre-line;
    text-align: left;
  }
  #reply.show { opacity: 1; transform: none; }
  #reply.error { color: #ff8a8a; }
  /* A short reply (one line, no wrap) still reads better centered than
     left-stuck; only multi-line replies benefit from left alignment. */
  #reply:not(.multiline) { text-align: center; }

  #chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 640px;
  }
  #chips .lead { width: 100%; text-align: center; font-size: 12px; color: var(--text-mute); margin-bottom: 2px; }
  #chips span.chip {
    font-size: 12.5px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    border-radius: var(--radius-pill);
    padding: 6px 12px;
  }
  body:not([data-state="idle"]) #chips { opacity: 0.35; }
  #chips { transition: opacity 0.3s ease; }

  #support-note { color: var(--warn); font-size: 13px; text-align: center; min-height: 18px; }

  .goal.flash { animation: goalflash 1.6s ease-out; }
  @keyframes goalflash {
    0%   { box-shadow: 0 0 0 3px var(--accent); background: var(--accent-soft); }
    100% { box-shadow: var(--shadow-sm); }
  }
</style>
</head>
<body>
<div id="app">

  <section id="stage">
    <header>
      <div>
        <div class="title">Onward</div>
        <div class="subtitle">One last thing you have to hold in your head</div>
      </div>

    </header>

        <div id="state-label">Tap to talk</div>

  <aside id="sidebar">

      <h1>Your goals</h1>

    </header>
    <div id="goals">
      <div class="skeleton-wrap">
        <div class="skeleton-card">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line meta"></div>
          <div class="skeleton-line item"></div>
          <div class="skeleton-line item short"></div>
          <div class="skeleton-line item"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line meta"></div>
          <div class="skeleton-line item"></div>

        <button type="button" data-advance="5">+5 days</button>
        <button type="button" id="reset-clock" title="Reset to real time">⟲ reset</button>
      </div>
      <div class="clock" id="clock">Clock: real time</div>
    </div>
  </aside>

</div>

<script>
const MCP_URL = '/mcp';
const MCP_TIMEOUT_MS = 45_000;

async function mcpCall(toolName, args = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), MCP_TIMEOUT_MS);
  try {
    const body = { jsonrpc: '2.0', id: Date.now(), method: 'tools/call', params: { name: toolName, arguments: args } };
    const res = await fetch(MCP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(`MCP HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error.message ?? 'MCP error');
    const text = json.result?.content?.[0]?.text ?? '';
    try { return JSON.parse(text); } catch { return text; }
  } finally { clearTimeout(timer); }
}

async function advanceDays(n) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), MCP_TIMEOUT_MS);
  try {
    const res = await fetch('/demo/advance', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ days: n }), signal: controller.signal });
    if (!res.ok) throw new Error(`advance HTTP ${res.status}`);
    return res.json();
  } finally { clearTimeout(timer); }
}

async function resetClock() {
  const res = await fetch('/demo/reset', { method: 'POST' });
  if (!res.ok) throw new Error(`reset HTTP ${res.status}`);
  return res.json();
}

// Read-only: reports the clock without moving it, so the display can be
// re-synced on page load without side effects.
async function fetchClockState() {
  const res = await fetch('/demo/clock-state', { method: 'GET' });
  if (!res.ok) throw new Error(`clock-state HTTP ${res.status}`);
  return res.json();
}

async function fetchPendingFlag() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), MCP_TIMEOUT_MS);
  try {
    const res = await fetch('/demo/pending-flag', { method: 'GET', signal: controller.signal });
    if (!res.ok) throw new Error(`pending-flag HTTP ${res.status}`);
    return res.json();
  } finally { clearTimeout(timer); }
}

const $goals = document.getElementById('goals');
const $refresh = document.getElementById('refresh');
const $clock = document.getElementById('clock');
const $resetBtn = document.getElementById('reset-clock');
const $flagBanner = document.getElementById('flag-banner');
const $flagTitle = document.getElementById('flag-title');
const $flagMessage = document.getElementById('flag-message');
const $flagDismiss = document.getElementById('flag-dismiss');

// ---------------------------------------------------------------------------
// Reminder banner
// ---------------------------------------------------------------------------

function showFlagBanner(flag) {
  if (!flag || !flag.message) { hideFlagBanner(); return; }
  $flagTitle.textContent = flag.goal_title ? flag.goal_title : 'Heads up';
  $flagMessage.textContent = flag.message;
  $flagBanner.classList.add('visible');
}

function hideFlagBanner() {
  $flagBanner.classList.remove('visible');
}

$flagDismiss.addEventListener('click', () => {
  hideFlagBanner();
});

// ---------------------------------------------------------------------------
// Clock label
// ---------------------------------------------------------------------------

function updateClockLabel(result) {
  const dateStr = result.now.slice(0, 10);
  if (result.simulated && typeof result.offset_days === 'number') {
    const off = Math.round(result.offset_days);
    const sign = off >= 0 ? '+' : '';
    $clock.textContent = `Clock: ${dateStr} (${sign}${off}d)`;
    $clock.classList.add('sim');
  } else {
    $clock.textContent = `Clock: ${dateStr}`;
    $clock.classList.remove('sim');
  }
}

// ---------------------------------------------------------------------------
// Sidebar
// ---------------------------------------------------------------------------

$refresh.addEventListener('click', refreshSidebar);

async function refreshSidebar() {
  $refresh.disabled = true;
  try {
    const list = await mcpCall('list_goals', {});
    const goals = Array.isArray(list?.goals) ? list.goals : [];
    if (goals.length === 0) {
      $goals.innerHTML = `
        <div class="empty">
          <strong>No goals yet.</strong>
          Tap the orb and tell Onward what you're working toward.
        </div>`;
      return;
    }
    const detailed = await Promise.all(goals.map((g) => mcpCall('get_goal', { goal_id: g.id, event_limit: 5 })));
    $goals.innerHTML = '';
    for (const d of detailed) {
      if (d?.goal) $goals.appendChild(renderGoalCard(d));
    }
  } catch (err) {
    $goals.innerHTML = `<div class="empty"><strong>Couldn't load goals.</strong>${escapeHtml(err.message)}</div>`;
  } finally {
    $refresh.disabled = false;
  }
}

async function refreshOneGoal(goalId) {
  const existing = $goals.querySelector(`.goal[data-goal-id="${cssEscape(goalId)}"]`);
  let detail;
  try {
    detail = await mcpCall('get_goal', { goal_id: goalId, event_limit: 5 });
  } catch { await refreshSidebar(); return; }
  if (!detail?.goal) { await refreshSidebar(); return; }
  const newCard = renderGoalCard(detail);
  if (existing) existing.replaceWith(newCard);
  else {
    const empty = $goals.querySelector('.empty');
    if (empty) empty.remove();
    $goals.appendChild(newCard);
  }
}

function pickTouchedGoalId(response) {
  const d = response?.data;
  if (!d || typeof d !== 'object') return null;
  if (d.goal?.id) return d.goal.id;
  if (d.goal_id) return d.goal_id;
  if (d.requirement?.goal_id) return d.requirement.goal_id;
  if (Array.isArray(d.goal_ids) && d.goal_ids.length === 1) return d.goal_ids[0];
  return null;
}

function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }

function hashType(t) {
  if (!t) return 0;
  let h = 0;
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0;
  return Math.abs(h) % 5 + 1;
}

function typeGlyph(t) {
  if (!t) return '◎';
  const map = {
    grad_scholarship_application: '◆',
    visa_permit_application: '🛂',
    job_application_with_references: '★',
    grant_application: '✦',
    signed_form_return: '✎',
    school_enrollment: '⌂',
    camp_registration: '☀',
    doctor_appointment_paperwork: '✚',
    lease_signing: '⌘',
    tax_filing: '§',
  };
  return map[t] || '◎';
}

function renderGoalCard(detail) {
  const { goal, requirements } = detail;
  const card = document.createElement('div');
  card.className = 'goal';
  card.dataset.goalId = goal.id;

  const typeClass = `type-${hashType(goal.goal_type)}`;

  const top = document.createElement('div');
  top.className = 'top';

  const glyph = document.createElement('div');
  glyph.className = `glyph ${typeClass}`;
  glyph.textContent = typeGlyph(goal.goal_type);
  top.appendChild(glyph);

  const head = document.createElement('div');
  head.className = 'head';

  const h2 = document.createElement('h2');
  h2.textContent = goal.title;
  head.appendChild(h2);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = `Due ${goal.deadline}`;
  if (goal.goal_type) meta.textContent += ` · ${prettyType(goal.goal_type)}`;
  head.appendChild(meta);

  top.appendChild(head);
  card.appendChild(top);

  const total = requirements.length;
  const done = requirements.filter((r) => r.status === 'done').length;
  const progress = document.createElement('div');
  progress.className = 'progress';
  const bar = document.createElement('div');
  bar.className = 'bar';
  const fill = document.createElement('div');
  fill.className = 'fill';
  fill.style.width = total > 0 ? `${(done / total) * 100}%` : '0%';
  bar.appendChild(fill);
  progress.appendChild(bar);
  const count = document.createElement('div');
  count.className = 'count';
  count.textContent = `${done} of ${total} completed`;
  progress.appendChild(count);
  card.appendChild(progress);

  const ul = document.createElement('ul');
  ul.className = 'items';
  const sorted = [...requirements].sort((a, b) => (a.status === 'done' ? 1 : 0) - (b.status === 'done' ? 1 : 0));
  for (const r of sorted) ul.appendChild(renderItem(r));
  card.appendChild(ul);

  return card;
}

function renderItem(r) {
  const li = document.createElement('li');
  if (r.status === 'done') li.classList.add('done');

  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.textContent = statusIcon(r.status);
  li.appendChild(icon);

  const body = document.createElement('div');
  body.className = 'body';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = r.label;
  body.appendChild(label);

  const badges = [];
  if (r.depends_on) badges.push({ text: r.depends_on, cls: r.status === 'waiting_on_other' ? 'accent' : '' });
  if (r.requested_at) badges.push({ text: `requested ${String(r.requested_at).slice(0, 10)}` });
  if (r.status === 'done' && r.received_at) badges.push({ text: `received ${String(r.received_at).slice(0, 10)}`, cls: 'ok' });
  if (r.status === 'waiting_on_other' && !r.requested_at) badges.push({ text: 'waiting', cls: 'warn' });

  if (badges.length) {
    const sub = document.createElement('div');
    sub.className = 'sub';
    for (const b of badges) {
      const span = document.createElement('span');
      span.className = 'badge' + (b.cls ? ' ' + b.cls : '');
      span.textContent = b.text;
      sub.appendChild(span);
    }
    body.appendChild(sub);
  }

  li.appendChild(body);
  return li;
}

function statusIcon(status) {
  switch (status) {
    case 'done': return '✓';
    case 'waiting_on_other': return '⏳';
    case 'in_progress': return '◐';
    case 'not_started': return '○';
    default: return '·';
  }
}

function prettyType(t) {
  return String(t).replace(/_/g, ' ');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------------------
// Time travel
// ---------------------------------------------------------------------------

function setDemoButtonsDisabled(disabled) {
  document.querySelectorAll('#demo [data-advance]').forEach((b) => (b.disabled = disabled));
  if ($resetBtn) $resetBtn.disabled = disabled;
}

document.querySelectorAll('#demo [data-advance]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const days = Number(btn.dataset.advance);
    setDemoButtonsDisabled(true);
    try {
      const result = await advanceDays(days);
      updateClockLabel(result);
      // Clock events update only the clock/status panel. Nothing goes
      // into the chat transcript.
      if (result.proactive_message) {
        showFlagBanner({ goal_title: null, message: result.proactive_message });
      }
      refreshSidebar().catch(() => {});
    } catch (err) {
      showError(`Couldn't advance time: ${err.message}`);
    } finally { setDemoButtonsDisabled(false); }
  });
});

if ($resetBtn) {
  $resetBtn.addEventListener('click', async () => {
    setDemoButtonsDisabled(true);
    try {
      const result = await resetClock();
      updateClockLabel(result);
      refreshSidebar().catch(() => {});
    } catch (err) { showError(`Couldn't reset the clock: ${err.message}`); }
    finally { setDemoButtonsDisabled(false); }
  });
}

// ---------------------------------------------------------------------------
// Initial load
// ---------------------------------------------------------------------------

async function loadInitialFlag() {
  try {
    const result = await fetchPendingFlag();
    if (result?.pending_flag) showFlagBanner(result.pending_flag);
  } catch { /* ignore */ }
}

// The clock lives only in server memory (see services/clock.js) — a page
// refresh never moves it — but until now nothing on load ever asked the
// server what it was currently at, so the label just sat on its hardcoded
// "Clock: real time" markup regardless of how far time had been advanced.
async function loadInitialClock() {
  try {
    const result = await fetchClockState();
    updateClockLabel(result);
  } catch { /* leave the default label if this fails */ }
}

refreshSidebar();
loadInitialFlag();
// ---------------------------------------------------------------------------
// Voice
//
// Speech in:  the browser's SpeechRecognition (Chrome / Edge).
// Speech out: Groq's Orpheus voice through POST /tts. If that is unavailable,
//             the browser's own voice takes over for that reply.
// Tap the orb to start. Onward listens, answers out loud, then listens again.
// Two quiet turns in a row ends the conversation.
// ---------------------------------------------------------------------------
const $orb = document.getElementById('orb');
const $stateLabel = document.getElementById('state-label');
const $heard = document.getElementById('heard');
const $reply = document.getElementById('reply');
const $supportNote = document.getElementById('support-note');

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis || null;

const STATE_LABELS = {
  idle: 'Tap to talk',
  listening: 'Listening',
  thinking: 'One moment',
  speaking: '',
};

let state = 'idle';
let active = false;          // a conversation is running
let busy = false;            // a request is in flight
let recog = null;
let ignoreEnd = false;
let silences = 0;
let speakToken = 0;          // bumped to cancel whatever is being spoken
let endCurrentSound = null;
let audioEl = null;
let audioCtx = null;
let slowTimer = null;

function setState(next) {
  state = next;
  document.body.dataset.state = next;
  $stateLabel.textContent = STATE_LABELS[next] ?? '';
}
setState('idle');

function showReply(text, isError = false) {
  $reply.textContent = text;
  $reply.classList.toggle('error', isError);
  $reply.classList.add('show');
  // Long, multi-paragraph replies (briefings) read better left-aligned;
  // short one-line replies still look right centered.
  const isLong = text.length > 90 || text.includes('\n');
  $reply.classList.toggle('multiline', isLong);
}

function clearReply() {
  $reply.classList.remove('show');
  $reply.classList.remove('multiline');
}

function showError(text) {
  showReply(text, true);
}

// ---------------------------------------------------------------------------
// Making text sound like speech
// ---------------------------------------------------------------------------

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
  'August', 'September', 'October', 'November', 'December'];
const SHORT_MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, jun: 5, jul: 6, aug: 7, sep: 8, sept: 8, oct: 9, nov: 10, dec: 11 };

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function toSpeech(message) {
  let t = String(message ?? '');
  t = t.replace(/\(id [^)]*\)/gi, '');
  t = t.replace(/\b(20\d\d)-(\d\d)-(\d\d)\b/g, (m, y, mo, d) => {
    const i = Number(mo) - 1;
    return MONTHS[i] ? `${MONTHS[i]} ${ordinal(Number(d))}` : m;
  });
  t = t.replace(/\b(Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sept|Sep|Oct|Nov|Dec)\.? (\d{1,2})\b/g, (m, mon, d) => {
    const i = SHORT_MONTHS[mon.toLowerCase()];
    return i === undefined ? m : `${MONTHS[i]} ${ordinal(Number(d))}`;
  });
  t = t.replace(/\s*\/\s*/g, ' or ');
  t = t.replace(/\s*\(([^)]*)\)/g, ', $1,');
  t = t.replace(/[—–]/g, ', ');
  t = t.replace(/[*_#`\[\]]/g, '');
  t = t.replace(/\n+/g, '. ');
  t = t.replace(/,\s*,/g, ',').replace(/,\s*([.!?])/g, '$1').replace(/\.\s*\./g, '.');
  t = t.replace(/\s+/g, ' ').trim();
  return t;
}

// Up to two chunks of at most 200 characters, cut at sentence ends.
function chunkSpeech(text) {
  const MAX = 200;
  const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const chunks = [];
  let cur = '';
  for (let s of sentences) {
    s = s.trim();
    if (!s) continue;
    while (s.length > MAX) {
      let cut = s.lastIndexOf(',', MAX);
      if (cut < 60) cut = s.lastIndexOf(' ', MAX);
      if (cut < 1) cut = MAX;
      const head = s.slice(0, cut + 1).trim();
      if (cur) { chunks.push(cur); cur = ''; }
      chunks.push(head);
      s = s.slice(cut + 1).trim();
    }
    if ((cur + ' ' + s).trim().length > MAX) {
      if (cur) chunks.push(cur);
      cur = s;
    } else {
      cur = (cur + ' ' + s).trim();
    }
  }
  if (cur) chunks.push(cur);
  return chunks.slice(0, 2);
}

// ---------------------------------------------------------------------------
// Speaking
// ---------------------------------------------------------------------------

function ensureAudio() {
  if (!audioEl) audioEl = new Audio();
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch { /* no audio context */ }
}

function tick() {
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.13);
  } catch { /* audio not available */ }
}

async function fetchTts(text) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 6000);
  try {
    const res = await fetch('/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
      signal: controller.signal,
    });
    if (!res.ok) return null;
    const blob = await res.blob();
    return blob.size > 0 ? URL.createObjectURL(blob) : null;
  } catch {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function playUrl(url, token) {
  return new Promise((resolve) => {
    if (token !== speakToken || !audioEl) { resolve(); return; }
    const done = () => { endCurrentSound = null; resolve(); };
    endCurrentSound = done;
    audioEl.onended = done;
    audioEl.onerror = done;
    audioEl.src = url;
    audioEl.play().catch(done);
  });
}

let browserVoice = null;
function pickBrowserVoice() {
  if (!synth) return;
  const voices = synth.getVoices().filter((v) => /^en/i.test(v.lang));
  const prefer = [/Aria.*Natural|Jenny.*Natural|Online \(Natural\)/i, /Natural/i, /Google US English/i, /Samantha|Aria|Jenny|Zira/i];
  for (const re of prefer) {
    const v = voices.find((x) => re.test(x.name));
    if (v) { browserVoice = v; return; }
  }
  browserVoice = voices[0] || null;
}
if (synth) { pickBrowserVoice(); synth.onvoiceschanged = pickBrowserVoice; }

function browserSpeak(text, token) {
  return new Promise((resolve) => {
    if (!synth || token !== speakToken) { resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 1.03;
    if (browserVoice) u.voice = browserVoice;
    const done = () => { endCurrentSound = null; resolve(); };
    endCurrentSound = done;
    u.onend = done;
    u.onerror = done;
    synth.speak(u);
  });
}

function stopSpeaking() {
  speakToken++;
  try { if (audioEl) { audioEl.pause(); } } catch { /* ignore */ }
  try { if (synth) synth.cancel(); } catch { /* ignore */ }
  if (endCurrentSound) endCurrentSound();
}

async function speak(message) {
  const text = toSpeech(message);
  if (!text) return;
  const token = ++speakToken;
  const chunks = chunkSpeech(text);
  setState('speaking');
  // Ask for every chunk at once, then play them in order.
  const pending = chunks.map((c) => fetchTts(c));
  for (let i = 0; i < chunks.length; i++) {
    if (token !== speakToken) return;
    const url = await pending[i];
    if (token !== speakToken) { if (url) URL.revokeObjectURL(url); return; }
    if (url) {
      await playUrl(url, token);
      URL.revokeObjectURL(url);
    } else {
      await browserSpeak(chunks[i], token);
    }
  }
}

// ---------------------------------------------------------------------------
// Talking to Onward
// ---------------------------------------------------------------------------

async function sendStatement(text) {
  const first = await mcpCall('report_statement', { text });
  if (first && first.data && first.data.retryable === true) {
    const second = await mcpCall('report_statement', { text });
    return second;
  }
  return first;
}

function startSlowTimer() {
  clearTimeout(slowTimer);
  slowTimer = setTimeout(() => {
    if (state === 'thinking') $stateLabel.textContent = 'Still working on it';
  }, 6000);
}

async function handleUtterance(text) {
  if (busy) return;
  busy = true;
  setState('thinking');
  startSlowTimer();
  $heard.textContent = `\u201C${text}\u201D`;
  clearReply();
  tick();

  let reply;
  let failed = false;
  try {
    const response = await sendStatement(text);
    reply = response?.message || "Sorry, I didn't catch that.";

    if (response?.proactive_flag) showFlagBanner(response.proactive_flag);

    const touched = pickTouchedGoalId(response);
    if (touched) refreshOneGoal(touched).catch(() => {});
    else refreshSidebar().catch(() => {});
  } catch (err) {
    failed = true;
    reply = err.name === 'AbortError'
      ? 'That took too long. Try again.'
      : 'Something went wrong. Try again.';
  }

  clearTimeout(slowTimer);
  showReply(reply, failed);
  await speak(reply);
  busy = false;

  if (active) listen();
  else setState('idle');
}

// An announcement Onward makes on its own, such as a reminder after time travel.
async function speakAnnouncement(message) {
  if (busy || state === 'listening') return;
  ensureAudio();
  busy = true;
  showReply(message);
  $heard.textContent = '';
  await speak(message);
  busy = false;
  if (active) listen();
  else setState('idle');
}

// ---------------------------------------------------------------------------
// Listening
// ---------------------------------------------------------------------------

function endConversation(note) {
  active = false;
  silences = 0;
  if (note) $supportNote.textContent = note;
  setState('idle');
}

function listen() {
  if (!SpeechRec || busy) return;
  stopSpeaking();
  recog = new SpeechRec();
  recog.lang = 'en-US';
  recog.interimResults = true;
  recog.continuous = false;
  recog.maxAlternatives = 1;

  let finalText = '';
  let interim = '';
  let errorCode = null;
  ignoreEnd = false;

  recog.onstart = () => {
    setState('listening');
    $heard.textContent = '';
  };
  recog.onresult = (e) => {
    interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    const shown = (finalText + interim).trim();
    if (shown) $heard.textContent = `\u201C${shown}\u201D`;
  };
  recog.onerror = (e) => { errorCode = e.error; };
  recog.onend = () => {
    if (ignoreEnd) return;
    const text = (finalText || interim).trim();

    if (errorCode === 'not-allowed' || errorCode === 'service-not-allowed') {
      endConversation('The microphone is blocked. Allow it in the address bar and tap the orb again.');
      return;
    }
    if (errorCode === 'network') {
      endConversation('Speech recognition needs an internet connection.');
      return;
    }
    if (text) {
      silences = 0;
      handleUtterance(text);
      return;
    }
    silences++;
    if (active && silences < 2) setTimeout(listen, 200);
    else endConversation();
  };

  try { recog.start(); } catch { /* already started */ }
}

function stopListening() {
  ignoreEnd = true;
  try { if (recog) recog.abort(); } catch { /* ignore */ }
}

// ---------------------------------------------------------------------------
// The orb
// ---------------------------------------------------------------------------

$orb.addEventListener('click', () => {
  if (!SpeechRec) return;
  ensureAudio();
  $supportNote.textContent = '';

  if (state === 'idle') {
    active = true;
    silences = 0;
    listen();
    return;
  }
  if (state === 'speaking') {
    // Tapping while Onward talks cuts it off and listens.
    stopSpeaking();
    busy = false;
    active = true;
    listen();
    return;
  }
  if (state === 'listening') {
    stopListening();
    endConversation();
    return;
  }
  // thinking: nothing to interrupt
});

if (!SpeechRec) {
  $supportNote.textContent = 'Voice input works in Chrome or Edge. Open this page there.';
  $orb.disabled = true;
  $orb.style.opacity = '0.4';
}

loadInitialClock();
</script>
</body>
</html>
